name: Android checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-36'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android x86_64-linux-android i686-linux-android
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test
      # Debug signing is used only to check that Android and Rust compile.
      - run: flutter build apk --debug --target-platform android-arm64
